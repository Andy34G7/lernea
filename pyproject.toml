[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "tokenisers"
version = "0.1.0"
description = "Modular Rust & Python Research and Benchmarking Platform for Tokenizers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    # wrapper.py needs the v5 special-token API (5.0.0 fails its tests, 5.2.0 passes them), but
    # AutoTokenizer parity with one-byte special tokens ("\n") needs >=5.21.0 (it fails on 5.2-5.20.2;
    # tests/e2e/test_bindings_hf_parity.py). 5.21.0 requires Python >=3.11, so on 3.10 the newest
    # installable is 5.20.2 and that parity does not hold.
    "transformers>=5.21.0; python_version >= '3.11'",
    "transformers>=5.2.0; python_version < '3.11'",
    "torch>=2.4",  # transformers 5.x
    "datasets>=2.18.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "maturin>=1.15.0",
    "tiktoken>=0.7",  # nanogpt_swap: GPT-2 tokenizer (decoding the source shards; llm.c trainer import)
]

[project.scripts]
tokenisers-data = "tokenisers.data.__main__:main"
tokenisers-tokka = "tokenisers.benchmarks.tokka.__main__:main"
tokenisers-intrinsic = "tokenisers.benchmarks.intrinsic.__main__:main"
tokenisers-colab = "tokenisers.benchmarks.colab.__main__:main"
tokenisers-dashboard = "tokenisers.dashboard.__main__:main"

[tool.maturin]
python-source = "python"
manifest-path = "crates/tokenisers_py/Cargo.toml"
module-name = "tokenisers._core"
features = ["pyo3/extension-module"]
